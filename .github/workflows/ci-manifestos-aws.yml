# =============================================================================
# CI dos manifestos e scripts de deploy na AWS — validação estática, sem nuvem.
#
# Nenhum passo precisa de credencial: roda em pull request de qualquer origem.
#
# Os manifestos têm marcadores (NAMESPACE, NODE_PORT, HPA_MIN, HPA_MAX,
# IMAGE_URI) que o deploy substitui — `nodePort: NODE_PORT` não é YAML válido
# para o Kubernetes. Por isso a validação renderiza primeiro, com os valores
# reais de cada ambiente, exatamente como o infra/scripts/deploy.sh faz.
# =============================================================================
name: CI - Manifestos AWS

on:
  pull_request:
    paths:
      - 'infra/k8s/aws/**'
      - 'infra/scripts/**'
      - '.github/workflows/ci-manifestos-aws.yml'
  push:
    branches: [main, homologacao]
    paths:
      - 'infra/k8s/aws/**'
      - 'infra/scripts/**'
      - '.github/workflows/ci-manifestos-aws.yml'

permissions:
  contents: read

jobs:
  manifestos:
    name: Manifestos (${{ matrix.ambiente }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { ambiente: producao,    node_port: 30080, hpa_min: 2, hpa_max: 8 }
          - { ambiente: homologacao, node_port: 30081, hpa_min: 1, hpa_max: 3 }

    steps:
      - uses: actions/checkout@v4

      - name: Instalar kubeconform
        run: |
          VERSION=v0.6.7
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Renderizar
        run: |
          set -euo pipefail
          mkdir -p render
          cp infra/k8s/aws/*.yaml render/
          sed -i \
            -e 's|IMAGE_URI|123456789012.dkr.ecr.us-east-1.amazonaws.com/autopecas:ci|g' \
            -e 's|NAMESPACE|${{ matrix.ambiente }}|g' \
            -e 's|NODE_PORT|${{ matrix.node_port }}|g' \
            -e 's|HPA_MIN|${{ matrix.hpa_min }}|g' \
            -e 's|HPA_MAX|${{ matrix.hpa_max }}|g' \
            render/*.yaml
          if grep -hvE '^\s*#' render/*.yaml | grep -qE 'IMAGE_URI|NAMESPACE|NODE_PORT|HPA_MIN|HPA_MAX'; then
            echo "::error::Sobrou marcador sem substituir"
            exit 1
          fi

      - name: Validar
        run: kubeconform -summary -strict -kubernetes-version 1.35.0 render/

  scripts:
    name: Sintaxe dos scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          set -euo pipefail
          for f in infra/scripts/*.sh infra/docker/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done
