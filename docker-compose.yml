# =============================================================================
# Stack de desenvolvimento local.
#
#   docker compose up -d --build      → postgres + app
#   docker compose --profile qa up -d → sobe também SonarQube (pesado, ~2 GB)
#
# O SonarQube ficou atrás de um profile porque só é necessário ao rodar a
# análise; sem isso, todo `up` levantava dois bancos e uma JVM extra.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autopecas-api:local
    container_name: autopecas_app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/app_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_ISSUER: ${JWT_ISSUER:?Configure JWT_ISSUER com a URL do emissor Lambda}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-${JWT_ISSUER}/.well-known/jwks.json}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-autopecas-api}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Análise estática (opcional) ────────────────────────────────────────────
  postgres_sonar:
    image: postgres:16-alpine
    container_name: postgres_sonar_db
    profiles: ["qa"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    profiles: ["qa"]
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres_sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      postgres_sonar:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
