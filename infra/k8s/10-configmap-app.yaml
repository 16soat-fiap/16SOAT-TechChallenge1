# =============================================================================
# Configuração NÃO sensível da aplicação.
#
# A divisão entre este ConfigMap e o Secret ao lado segue um critério simples:
# se o valor puder aparecer num `kubectl describe` sem causar dano, é ConfigMap.
# Host de banco, issuer e JWKS são endereços — não credenciais.
#
# Os nomes das chaves são exatamente as variáveis de ambiente lidas por
# application-prod.yml, e por isso entram no pod via `envFrom`.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: autopecas-config
  namespace: autopecas
  labels:
    app.kubernetes.io/name: autopecas-api
    app.kubernetes.io/part-of: autopecas
data:
  SPRING_PROFILES_ACTIVE: "prod"

  # O Service `postgres` é criado pelo Terraform, no mesmo namespace.
  DB_URL: "jdbc:postgresql://postgres:5432/app_db"

  # Substitua pelo issuer do ambiente antes de publicar.
  JWT_ISSUER: "https://SUBSTITUA.execute-api.us-east-1.amazonaws.com/homologacao"
  JWT_JWKS_URI: "https://SUBSTITUA.execute-api.us-east-1.amazonaws.com/homologacao/.well-known/jwks.json"
  JWT_AUDIENCE: "autopecas-api"

  TZ: "UTC"
