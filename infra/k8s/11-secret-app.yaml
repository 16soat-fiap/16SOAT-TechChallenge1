# =============================================================================
# ⚠️  VALORES DE DESENVOLVIMENTO — NÃO USAR EM PRODUÇÃO
#
# Este arquivo existe versionado para que o ambiente local suba com um único
# comando e para tornar explícito, na avaliação, quais variáveis são tratadas
# como sensíveis. Um Secret do Kubernetes é apenas base64: qualquer um com
# acesso de leitura ao namespace lê o conteúdo em claro.
#
# Em produção, este arquivo não deve existir no repositório. Os caminhos usuais:
#
#   • External Secrets Operator — o Secret é sincronizado de um cofre
#     (AWS Secrets Manager, Vault, Azure Key Vault) e nada sensível é versionado.
#   • Sealed Secrets (Bitnami) — o valor é cifrado com a chave pública do
#     cluster e só o controlador dentro dele consegue decifrar; o arquivo
#     cifrado pode ser versionado com segurança.
#   • `kubectl create secret generic ... --from-literal=...` num passo de
#     pipeline, com os valores vindos do cofre de segredos do CI.
#
# Ver infra/k8s/README.md, seção "Segredos em produção".
#
# `stringData` aceita texto puro e o Kubernetes converte para base64 ao gravar —
# preferido a `data` por ser legível e revisável.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: autopecas-secrets
  namespace: autopecas
  labels:
    app.kubernetes.io/name: autopecas-api
    app.kubernetes.io/part-of: autopecas
type: Opaque
stringData:
  # Credenciais do PostgreSQL da aplicação
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: autopecas
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: autopecas
type: Opaque
stringData:
  # Console administrativo do Keycloak
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  # Acesso do Keycloak ao seu próprio banco
  KC_DB_USERNAME: "postgres"
  KC_DB_PASSWORD: "postgres"
