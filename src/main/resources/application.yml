spring:
  application:
    name: autopecas

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      resourceserver:
        jwt:
          # A URL interna (Backend falando com Keycloak via rede do Docker Compose).
          # OAUTH2_JWK_URI é a variável passada pelo docker-compose ao serviço `app`.
          jwk-set-uri: ${OAUTH2_JWK_URI:http://keycloak:8080/realms/autopecas/protocol/openid-connect/certs}
          # A URL externa (Validação da origem do Token emitido pro cliente)
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9080/realms/autopecas}

  jackson:
    time-zone: UTC

# Notificação de mudança de status da OS ao cliente.
#
# O envio real só ocorre quando um servidor SMTP é configurado — o Spring Boot só autoconfigura
# o JavaMailSender quando `spring.mail.host` existe. Por isso a chave NÃO é declarada aqui: sem
# ela, o adapter registra a notificação em log e a aplicação sobe sem depender de SMTP.
#
# Para ativar o envio, defina as variáveis (relaxed binding do Spring Boot):
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
notificacoes:
  email:
    remetente: ${MAIL_REMETENTE:nao-responda@autopecas.local}