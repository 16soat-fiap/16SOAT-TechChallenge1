# ─────────────────────────────────────────────────────────────────────────────
# Perfil de teste — testes de integração com Testcontainers + PostgreSQL real
#
# NÃO configura datasource aqui: o @DynamicPropertySource de cada classe de teste
# injeta URL/credenciais do container em execução.
#
# O schema é criado pelas MESMAS migrations Flyway usadas em produção (V1 + V2).
# Isso garante que os testes validem o schema real — incluindo as sequences
# os_numero_seq, mecanico_seq e atendente_seq, das quais a numeração de OS e as
# matrículas de funcionário dependem.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: UTC

  # O JwtDecoder real é substituído por SecurityTestConfig, que valida tokens
  # assinados em memória pelo JwtTestUtils. Estes valores existem apenas para
  # satisfazer a injeção de propriedades da SecurityConfig — nenhuma chamada HTTP
  # ao Keycloak é feita nos testes.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/realms/autopecas/protocol/openid-connect/certs
          issuer-uri: http://localhost:9999/realms/autopecas

keycloak:
  client-id: autopecas-api
  realm: autopecas
  auth-server-url: http://localhost:9999

logging:
  level:
    org.springframework.security: WARN
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    com.autopecas: DEBUG
