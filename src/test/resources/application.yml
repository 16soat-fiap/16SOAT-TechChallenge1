# ─────────────────────────────────────────────────────────────────────────────
# Perfil de teste — testes de integração com Testcontainers + PostgreSQL real
#
# NÃO configura datasource aqui: o @DynamicPropertySource de cada classe de teste
# injeta URL/credenciais do container em execução.
#
# O schema é criado pelas migrations Flyway de produção (V1 + V2 em db/migration).
# O seed de demonstração (db/demo) NÃO roda aqui — ele usa CPFs que colidem com os
# testes de integração (ex.: 52998224725).
# ─────────────────────────────────────────────────────────────────────────────

spring:
  profiles:
    active: test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://auth.example.test/.well-known/jwks.json
          issuer-uri: https://auth.example.test

auth:
  audience: autopecas-api

logging:
  level:
    org.springframework.security: WARN
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    com.autopecas: DEBUG
